[package]
name = "neel-browser"
version = "1.0.0"
description = "Ultra-lightweight privacy-first web browser powered by OS-native WebViews"
authors = ["Neel Browser Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["unstable"] }
url = "2"

# Aggressive binary size and memory footprint optimization
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
